<!-- headtags.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Complete HEAD Example</title>
  <!-- Sets the character encoding for the document -->
  <meta charset="UTF-8">
  <!-- Ensures proper rendering and touch zooming on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Provides a brief description for search engines -->
  <meta name="description" content="Demonstration of HTML head elements">
  <!-- Specifies the author of the document -->
  <meta name="author" content="Student Name">
  <!-- Sets a base URL for all relative links in the page -->
  <base href="https://example.com/">
  <!-- Adds a favicon to the browser tab -->
  <link rel="icon" href="favicon.ico">
  <!-- Embedded style definitions (empty but required) -->
  <style>
  </style>
  <!-- Embedded JavaScript (empty but required) -->
  <script>
  </script>
</head>
<body>
  <h2>Head Elements Example</h2>
  <p>This page includes all important head tags with comments explaining their purpose.</p>
</body>
</html>
