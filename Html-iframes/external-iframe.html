<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>External Site Embed</title>
</head>
<body>
  <h2>Wikipedia in an Iframe</h2>
  <iframe 
    src="https://www.wikipedia.org"
    title="Wikipedia"
    width="90%"
    height="400">
  </iframe>
  <p>Some websites may not allow embedding for security reasons.</p>
</body>
</html>
