<!-- map.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Map Embed</title>
</head>
<body>
  <h2>Our School/City Location</h2>
  <iframe 
    src="https://www.google.com/maps?q=New+Delhi,+India&output=embed"
    title="Map of New Delhi"
    width="80%"
    height="400"
    loading="lazy">
  </iframe>
  <!-- The 'loading="lazy"' attribute delays loading the iframe until it's visible, improving page speed -->
</body>
</html>
