<!-- feedback.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Form</title>
</head>
<body>
  <h2>Your Feedback</h2>
  <form method="post" action="#">
    <label for="feedback">Your feedback:</label>
    <textarea id="feedback" name="feedback" rows="5" cols="30" required title="Please enter your feedback" placeholder="Enter your feedback here"></textarea><br>
    <label><input type="radio" name="rating" value="Good" required> Good</label>
    <label><input type="radio" name="rating" value="Average" required> Average</label>
    <label><input type="radio" name="rating" value="Poor" required> Poor</label><br>
    <input type="submit" value="Submit">
  </form>
</body>
</html>
