<!-- upload.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Upload</title>
</head>
<body>
  <h2>Upload an Image</h2>
  <form>
    <label for="img">Choose an image to upload:</label>
    <input type="file" id="img" name="img" accept=".jpg, .jpeg, .png" required title="Select an image file" placeholder="Select image file">
    <input type="submit" value="Upload">
  </form>
  <p>Only .jpg or .png image files are allowed.</p>
</body>
</html>
