<!-- registration.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration</title>
</head>
<body>
  <h2>Registration Form</h2>
  <form>
    <label>Full Name: <input type="text" name="fullname" required></label><br>
    <label>Email Address: <input type="email" name="email" required></label><br>
    <label>Password: <input type="password" name="password" required></label><br>
    <label>Confirm Password: <input type="password" name="confirm-password" required></label><br>
    <input type="submit" value="Register">
  </form>
</body>
</html>
