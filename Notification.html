<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <main class="container my-5">
    <div class="card p-4">
      <h3>User Notifications</h3>
      <div class="alert alert-success" role="alert">
        New message received!
      </div>
      <div class="alert alert-info" role="alert">
        Tip: Use keyboard shortcuts to speed up your workflow.
      </div>
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        Warning! Your password will expire soon.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      <section class="bg-light border rounded p-3 mt-4">
        <h5>Summary</h5>
        <p>You have 3 new notifications pending your review.</p>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
