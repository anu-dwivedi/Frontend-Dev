<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Startup Landing Page</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <header class="bg-primary text-white p-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h3 mb-0">Startup Inc.</h1>
      <nav>
        <ul class="nav">
          <li class="nav-item"><a href="#" class="nav-link text-white">Home</a></li>
          <li class="nav-item"><a href="#" class="nav-link text-white">About</a></li>
          <li class="nav-item"><a href="#" class="nav-link text-white">Services</a></li>
          <li class="nav-item"><a href="#" class="nav-link text-white">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="container text-center text-md-start py-5">
      <div class="row align-items-center">
        <div class="col-md-6 mb-4 mb-md-0">
          <h2 class="display-4 fw-bold">Welcome to Startup Inc.</h2>
          <p class="lead">Innovating your digital future with cutting-edge solutions.</p>
          <a href="#" class="btn btn-primary btn-lg">Get Started</a>
        </div>
        <div class="col-md-6">
          <img src="https://via.placeholder.com/500x300" alt="Startup Hero Image" class="img-fluid rounded" />
        </div>
      </div>
    </section>
  </main>
  <!-- Bootstrap Bundle JS including Popper required for some components -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
