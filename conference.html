<!DOCTYPE html>
<html lang="en">
<head>
    <title>Conference Schedule</title>
</head>
<body>
    <h1>Annual Tech Conference 2025 Schedule</h1>
    <table border="1" title="Conference Schedule">
        <caption>Event Sessions</caption>
        <thead>
            <tr>
                <th>Session</th>
                <th>Time</th>
                <th>Topic</th>
                <th>Speaker</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Morning</td>
                <td>09:00</td>
                <td>Opening Keynote</td>
                <td>Dr. Verma</td>
            </tr>
            <tr>
                <td>10:30</td>
                <td>AI in Healthcare</td>
                <td>Ms. Iyer</td>
            </tr>
            <tr>
                <td>Afternoon</td>
                <td>13:00</td>
                <td>Cloud Security</td>
                <td>Mr. Singh</td>
            </tr>
            <tr>
                <td>Evening</td>
                <td>17:00</td>
                <td>Future of Web</td>
                <td>Ms. Das</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4">Sessions subject to change</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
