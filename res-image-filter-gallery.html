<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Responsive Image Filter Gallery</title>
<link rel="stylesheet" href="responsive-image-filter-gallery.css" />
</head>
<body>
  <header>
    <h1>Responsive Image Filter Gallery</h1>
  </header>
  <main>
    <section class="gallery">
      <figure>
        <img src="img1.jpg" alt="Blur Image" class="blur" />
        <figcaption>Blur</figcaption>
      </figure>
      <figure>
        <img src="img2.jpg" alt="Grayscale Image" class="grayscale" />
        <figcaption>Grayscale</figcaption>
      </figure>
      <figure>
        <img src="img3.jpg" alt="Sepia Image" class="sepia" />
        <figcaption>Sepia</figcaption>
      </figure>
      <figure>
        <img src="img4.jpg" alt="Brightness Image" class="brightness" />
        <figcaption>Brightness</figcaption>
      </figure>
      <figure>
        <img src="img5.jpg" alt="Contrast Image" class="contrast" />
        <figcaption>Contrast</figcaption>
      </figure>
      <figure>
        <img src="img6.jpg" alt="Hue Rotate Image" class="hue-rotate" />
        <figcaption>Hue Rotate</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
