<!DOCTYPE html>
<html lang="en">
<head>
    <title>Course Registration Form</title>
</head>
<body>
    <h1>Course Registration</h1>
    <form>
        <fieldset>
            <legend>Register</legend>
            Name: <input type="text" name="name" /><br>
            Email: <input type="email" name="email" /><br>
            Select Course:
            <select name="course">
                <option value="web" selected>Web Development</option>
                <option value="data">Data Science</option>
                <option value="ml">Machine Learning</option>
            </select>
        </fieldset>
        <br>
        <table border="1" title="Course Schedules">
            <tr>
                <th>Day</th>
                <th>Time</th>
                <th>Instructor</th>
            </tr>
            <tr>
                <td>Monday</td>
                <td>10:00 AM</td>
                <td>Mr. Sharma</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>2:00 PM</td>
                <td>Ms. Gupta</td>
            </tr>
        </table>
    </form>
</body>
</html>
