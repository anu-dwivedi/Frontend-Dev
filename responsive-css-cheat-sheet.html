<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Responsive CSS Cheat Sheet</title>
<link rel="stylesheet" href="responsive-css-cheat-sheet.css" />
</head>
<body>
  <main class="cheat-sheet">
    <section class="topic">
      <h3>Filters</h3>
      <p>Example: <code>filter: grayscale(100%);</code></p>
    </section>
    <section class="topic">
      <h3>Media Queries</h3>
      <p>Example: <code>@media (max-width: 600px) { ... }</code></p>
    </section>
    <section class="topic">
      <h3>Responsive Design</h3>
      <p>Using flexbox/grid and fluid layouts.</p>
    </section>
    <section class="topic">
      <h3>Typography</h3>
      <p>Use relative units like <code>clamp()</code> for scalable text.</p>
    </section>
  </main>
</body>
</html>
