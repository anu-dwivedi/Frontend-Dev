<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Highlight</title>
  <link rel="stylesheet" href="product.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <main>
    <section id="products">
      <article class="product" data-stock="5" data-discount="10">
        <h2 class="name">Phone</h2>
        <div class="details" style="display:none;">10% OFF! Popular smartphone.</div>
        <span class="icon favorite">&#10084;</span>
      </article>
      <article class="product" data-stock="0" data-discount="15">
        <h2 class="name">Headphones</h2>
        <div class="details" style="display:none;">15% OFF! Wireless headphones.</div>
        <span class="icon favorite">&#10084;</span>
      </article>
      <article class="product" data-stock="2">
        <h2 class="name">Shoes</h2>
        <div class="details" style="display:none;">Trendy running shoes.</div>
        <span class="icon favorite">&#10084;</span>
      </article>
      <article class="product" data-stock="8" data-discount="5">
        <h2 class="name">Laptop</h2>
        <div class="details" style="display:none;">5% OFF! Ultrabook laptop.</div>
        <span class="icon favorite">&#10084;</span>
      </article>
      <article class="product" data-stock="1">
        <h2 class="name">Book</h2>
        <div class="details" style="display:none;">New release book.</div>
        <span class="icon favorite">&#10084;</span>
      </article>
    </section>
  </main>
  <script src="product.js"></script>
</body>
</html>
