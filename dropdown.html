<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dropdown Selection Page</title>
</head>
<body>
    <h1>Travel Preferences</h1>
    <form>
        Country:
        <select>
            <option selected>India</option>
            <option>France</option>
            <option>Japan</option>
        </select>
        State:
        <select>
            <option selected>Maharashtra</option>
            <option>Delhi</option>
            <option>Tamil Nadu</option>
        </select>
        City:
        <select>
            <option selected>Mumbai</option>
            <option>Pune</option>
            <option>Chennai</option>
        </select>
        Favorite Tourist Place:
        <select>
            <option selected>Gateway of India</option>
            <option>Eiffel Tower</option>
            <option>Tokyo Tower</option>
        </select>
    </form>
    <p>Your preferred trip is to Mumbai, Maharashtra, India, visiting the Gateway of India.</p>
</body>
</html>
