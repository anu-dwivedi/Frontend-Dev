<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <main class="container my-5">
    <header class="d-flex justify-content-between align-items-center mb-3">
      <h3>Tasks</h3>
      <span class="badge bg-danger rounded-pill">5 Pending</span>
    </header>
    <ul class="list-group">
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Design homepage
        <span class="badge bg-danger rounded-pill">High</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Write blog post
        <span class="badge bg-warning text-dark rounded-pill">Medium</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Setup hosting
        <span class="badge bg-success rounded-pill">Low</span>
      </li>
    </ul>
    <button class="btn btn-outline-primary mt-3">
      Completed <span class="badge bg-secondary">3</span>
    </button>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
