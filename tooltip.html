<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tooltip Demo</title>
  <link rel="stylesheet" href="tooltip.css">
</head>
<body>
  <main class="flex-center">
    <div class="tooltip-group">
      <span class="tooltip-item">?
        <span class="tooltip-text">Help info here</span>
      </span>
      <span class="tooltip-item">i
        <span class="tooltip-text">More details</span>
      </span>
      <span class="tooltip-item">&#9881;
        <span class="tooltip-text">Settings explained</span>
      </span>
    </div>
  </main>
</body>
</html>
