<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
</head>
<body>
    <h1>Online Store Product Catalog</h1>
    <table border="1" title="Product Catalog">
        <tr>
            <th>Product Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
            <th>Image</th>
        </tr>
        <tr>
            <td rowspan="2">Smartphone X</td>
            <td>Latest model, 128GB storage</td>
            <td>$499</td>
            <td>In Stock</td>
            <td><img src="https://via.placeholder.com/60" alt="Smartphone X" /></td>
        </tr>
        <tr>
            <td colspan="4">Special offer: Free shipping this week!</td>
        </tr>
        <tr>
            <td>Laptop Pro</td>
            <td>High-performance, 15-inch display</td>
            <td>$999</td>
            <td>Limited</td>
            <td><img src="https://via.placeholder.com/60" alt="Laptop Pro" /></td>
        </tr>
        <tr>
            <td>Wireless Earbuds</td>
            <td>Noise-cancelling, compact design</td>
            <td>$79</td>
            <td>Out of Stock</td>
            <td><img src="https://via.placeholder.com/60" alt="Wireless Earbuds" /></td>
        </tr>
    </table>
</body>
</html>
