<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light text-dark">
  <header class="container text-center mt-4 mb-3">
    <h1 class="fw-bold">John Doe</h1>
    <p class="lead">Web Developer & Designer</p>
  </header>

  <main class="container text-center p-5">
    <img src="https://via.placeholder.com/150" alt="John Doe" class="img-fluid rounded-circle mb-4" />
    <div class="mb-4">
      <button class="btn btn-primary me-3">Hire Me</button>
      <button class="btn btn-outline-secondary">Download CV</button>
    </div>
    <form class="mx-auto" style="max-width: 300px;">
      <input type="email" class="form-control" placeholder="Your Email" aria-label="Email" />
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
