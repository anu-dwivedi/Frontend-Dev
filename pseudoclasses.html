<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pseudo-Classes Demo</title>
  <link rel="stylesheet" href="pseudoclasses.css">
</head>
<body>
  <header>
    <h1>Pseudo-Classes Demonstration</h1>
  </header>
  <main>
    <section class="pseudo-row">
      <div class="example">
        <a href="#" class="pseudo-link">Hover Me</a>
        <span class="desc">:hover changes link color</span>
      </div>
      <div class="example">
        <input type="text" class="pseudo-input" placeholder="Focus Me">
        <span class="desc">:focus adds border on input</span>
      </div>
      <div class="example">
        <button class="pseudo-btn">Click Me</button>
        <span class="desc">:active changes button color</span>
      </div>
      <div class="example">
        <ul class="pseudo-list">
          <li>Item 1</li>
          <li>Item 2</li>
          <li>Item 3</li>
          <li>Item 4</li>
        </ul>
        <span class="desc">:nth-child(2n) for even items highlight</span>
      </div>
    </section>
  </main>
</body>
</html>
