<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Custom Themed Blog</title>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root {
      --bs-primary: #9c27b0; /* custom purple */
      --bs-font-sans-serif: 'Montserrat', sans-serif;
    }
    body {
      font-family: var(--bs-font-sans-serif);
    }
    .custom-header {
      background-color: var(--bs-primary);
      color: white;
      padding: 2rem;
      text-align: center;
    }
    .card-title {
      color: var(--bs-primary);
    }
    .custom-footer {
      background-color: #f8f9fa;
      padding: 1.5rem;
      text-align: center;
      font-size: 0.9rem;
      color: #6c757d;
    }
  </style>
</head>
<body>
  <header class="custom-header">
    <h1 class="display-4">My Blog</h1>
  </header>

  <main class="container my-5">
    <div class="row g-4">
      <article class="col-md-6">
        <div class="card shadow-sm">
          <img src="https://via.placeholder.com/600x300" class="card-img-top" alt="Blog Post 1" />
          <div class="card-body">
            <h5 class="card-title">Post One Title</h5>
            <p class="card-text">A short intro to the first blog post. Explore exciting topics and good reads.</p>
            <a href="#" class="btn btn-primary">Read More</a>
          </div>
        </div>
      </article>
      <article class="col-md-6">
        <div class="card shadow-sm">
          <img src="https://via.placeholder.com/600x300" class="card-img-top" alt="Blog Post 2" />
          <div class="card-body">
            <h5 class="card-title">Post Two Title</h5>
            <p class="card-text">A brief overview of the second post, capturing readers’ attention creatively.</p>
            <a href="#" class="btn btn-primary">Read More</a>
          </div>
        </div>
      </article>
    </div>
  </main>

  <footer class="custom-footer">
    &copy; 2025 My Blog - All Rights Reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
