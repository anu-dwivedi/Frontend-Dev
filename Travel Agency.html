<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel Agency</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <main class="container my-4">
    <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner rounded-3 shadow">
        <div class="carousel-item active" data-bs-interval="4000">
          <img src="https://via.placeholder.com/900x400?text=Paris" class="d-block w-100" alt="Paris" />
          <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-2">
            <h5>Paris, France</h5>
            <p>The city of lights and love.</p>
          </div>
        </div>
        <div class="carousel-item" data-bs-interval="3000">
          <img src="https://via.placeholder.com/900x400?text=Maldives" class="d-block w-100" alt="Maldives" />
          <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-2">
            <h5>Maldives</h5>
            <p>Crystal clear waters and white beaches.</p>
          </div>
        </div>
        <div class="carousel-item" data-bs-interval="3500">
          <img src="https://via.placeholder.com/900x400?text=Tokyo" class="d-block w-100" alt="Tokyo" />
          <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-2">
            <h5>Tokyo, Japan</h5>
            <p>Where tradition meets innovation.</p>
          </div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
    <div class="progress mt-4" style="height: 20px;">
      <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 70%" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100">70% Booked</div>
    </div>
  </main>
  <footer class="text-center py-3 mt-4 bg-light">
    <p>Contact us: travel@agency.com | +123 456 7890</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
