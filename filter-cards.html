<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Filter Cards with Animation</title>
<link rel="stylesheet" href="filter-cards-with-animation.css" />
</head>
<body>
  <main class="profile-cards">
    <article class="profile-card">
      <img src="profile1.jpg" alt="Profile 1" class="filter-grayscale" />
      <div class="profile-text">Profile One</div>
    </article>
    <article class="profile-card">
      <img src="profile2.jpg" alt="Profile 2" class="filter-sepia" />
      <div class="profile-text">Profile Two</div>
    </article>
    <article class="profile-card">
      <img src="profile3.jpg" alt="Profile 3" class="filter-grayscale" />
      <div class="profile-text">Profile Three</div>
    </article>
  </main>
</body>
</html>
