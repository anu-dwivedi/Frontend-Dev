<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Restaurant Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <header class="text-center my-5">
    <h1>Today's Menu</h1>
  </header>
  <main class="container">
    <table class="table table-striped">
      <thead>
        <tr><th>Item</th><th>Category</th><th>Price</th></tr>
      </thead>
      <tbody>
        <tr><td>Margherita Pizza</td><td>Pizza</td><td>$12.00</td></tr>
        <tr><td>Caesar Salad</td><td>Salad</td><td>$8.50</td></tr>
        <tr><td>Spaghetti Carbonara</td><td>Pasta</td><td>$15.00</td></tr>
      </tbody>
    </table>

    <section class="my-5">
      <h5 class="text-center lead mb-3">Chef's Specials</h5>
      <ul class="list-group">
        <li class="list-group-item">Truffle Risotto</li>
        <li class="list-group-item">Lobster Bisque</li>
      </ul>
    </section>

    <figure class="text-center">
      <img src="https://via.placeholder.com/400x250" alt="Delicious Dish" class="img-fluid rounded" />
      <figcaption class="mt-2">Chef's Truffle Risotto - A house favorite</figcaption>
    </figure>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
