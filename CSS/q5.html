<!DOCTYPE html>
<html lang="en">
<head>
  <title>Pricing Table</title>
  <link rel="stylesheet" href="q5.css">
</head>
<body>
  <section class="pricing-table">
    <div class="plan">
      <h2>Basic</h2>
      <ul>
        <li>1 User</li>
        <li>Email Support</li>
        <li>No Analytics</li>
      </ul>
      <div class="price">$5/mo</div>
      <a href="#">Sign Up</a>
    </div>
    <div class="plan popular">
      <h2>Standard</h2>
      <ul>
        <li>5 Users</li>
        <li>Email & Chat Support</li>
        <li>Basic Analytics</li>
      </ul>
      <div class="price">$15/mo</div>
      <a href="#">Sign Up</a>
    </div>
    <div class="plan">
      <h2>Premium</h2>
      <ul>
        <li>Unlimited Users</li>
        <li>Priority Support</li>
        <li>Advanced Analytics</li>
      </ul>
      <div class="price">$25/mo</div>
      <a href="#">Sign Up</a>
    </div>
  </section>
</body>
</html>
