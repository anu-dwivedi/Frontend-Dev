<!DOCTYPE html>
<html lang="en">
<head>
  <title>Complete CSS Layout</title>
  <link rel="stylesheet" href="q10.css">
</head>
<body>
  <header>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>
  <section class="hero">
    <h1>Welcome to My Webpage</h1>
  </section>
  <section class="about">
    <div class="about-text">
      <h2>About Me</h2>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit...</p>
    </div>
    <div class="about-img">
      <img src="profile.jpg" alt="Profile Picture">
    </div>
  </section>
  <section class="services">
    <div class="service-box">Design</div>
    <div class="service-box">Development</div>
    <div class="service-box">Consulting</div>
  </section>
  <section class="contact">
    <form>
      <input type="text" placeholder="Your Name">
      <input type="email" placeholder="Your Email">
      <textarea placeholder="Message"></textarea>
      <button type="submit">Send</button>
    </form>
  </section>
  <footer>
    &copy; 2025 Copyright, All Rights Reserved
  </footer>
</body>
</html>
