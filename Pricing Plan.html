<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pricing Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .card:hover {
      box-shadow: 0 1rem 2rem rgba(0, 123, 255, 0.5) !important;
      transition: box-shadow 0.3s ease;
    }
  </style>
</head>
<body>
  <main class="container my-5">
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card h-100 text-center p-3 shadow-sm">
          <h5 class="card-title">Basic</h5>
          <p class="display-6">$9/mo</p>
          <ul class="list-unstyled">
            <li>5 Projects</li>
            <li>Email Support</li>
            <li>Basic Analytics</li>
          </ul>
          <button class="btn btn-outline-primary">Choose</button>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card h-100 text-center p-3 shadow-lg bg-primary text-white">
          <h5 class="card-title">Pro</h5>
          <p class="display-6">$29/mo</p>
          <ul class="list-unstyled">
            <li>30 Projects</li>
            <li>Priority Support</li>
            <li>Advanced Analytics</li>
          </ul>
          <button class="btn btn-light">Choose</button>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card h-100 text-center p-3 shadow-sm">
          <h5 class="card-title">Enterprise</h5>
          <p class="display-6">$99/mo</p>
          <ul class="list-unstyled">
            <li>Unlimited Projects</li>
            <li>Dedicated Support</li>
            <li>All Features</li>
          </ul>
          <button class="btn btn-outline-primary">Choose</button>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
